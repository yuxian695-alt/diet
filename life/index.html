<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="给一个人过日子的小工具：生活账本、冰箱库存、一周三餐、日常待办、采购清单。">
<meta name="theme-color" content="#FAFBF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="生活管家">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<!-- app:head -->
<title>纯过日子生活管家</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@500;600;700;800&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: brand bar + sticky pill tabs over grid paper; each tab is a 2-column card grid that folds to one column on phones */
:root{
  --paper:#FAFBF7; --grid:rgba(46,107,79,.07);
  --card:#FFFFFF; --card2:#F3F6F1; --line:#E1E8DF;
  --ink:#1E2A23; --ink2:#46544B; --mute:#78857C;
  --green:#2E6B4F; --green-ink:#FFFFFF; --mint:#E6F2E8; --mint2:#CDE5D3; --leaf:#5FA77A;
  --sun:#FFE45C; --sun-on:#2B2400; --sun-soft:#FFF7CF; --sun-ink:#7A5A00;
  --ok-bg:#E2F3E6; --ok:#23764A; --warn-bg:#FFF2C9; --warn:#8A5D00; --bad-bg:#FDE4E0; --bad:#B3261E;
  --tomato:#E5533D; --sunicon:#F0A410; --moonicon:#8C83C9;
  --c1:#5FA77A; --c2:#E5A23D; --c3:#E5533D; --c4:#5F95CF; --c5:#9C7BD0; --c6:#8A9A8F; --c7:#3FB0A8; --c8:#D06BA0;
  --shadow:0 1px 0 rgba(30,42,35,.03),0 10px 24px -18px rgba(30,42,35,.28);
  --scrim:rgba(18,28,22,.45);
  --f-body:"Nunito","PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --f-display:"ZCOOL KuaiLe","Nunito","PingFang SC","Noto Sans SC",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121714; --grid:rgba(140,200,160,.05);
  --card:#1A211C; --card2:#222B25; --line:#2D3830;
  --ink:#E6EEE8; --ink2:#BFCBC2; --mute:#8E9B92;
  --green:#7CC79A; --green-ink:#0F2418; --mint:#1E3226; --mint2:#2B4734; --leaf:#6FBF8C;
  --sun:#E9CB45; --sun-on:#221C00; --sun-soft:#353016; --sun-ink:#F0DA80;
  --ok-bg:#1C3325; --ok:#8AD6A6; --warn-bg:#3A3016; --warn:#F2C766; --bad-bg:#3E201C; --bad:#FF907F;
  --tomato:#FF7A63; --sunicon:#F5B93A; --moonicon:#ABA3E6;
  --c1:#6FBF8C; --c2:#EDB257; --c3:#FF7A63; --c4:#7EAFE3; --c5:#B396E2; --c6:#9AAA9F; --c7:#5CC7BF; --c8:#E58BBB;
  --shadow:none; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#121714; --grid:rgba(140,200,160,.05);
  --card:#1A211C; --card2:#222B25; --line:#2D3830;
  --ink:#E6EEE8; --ink2:#BFCBC2; --mute:#8E9B92;
  --green:#7CC79A; --green-ink:#0F2418; --mint:#1E3226; --mint2:#2B4734; --leaf:#6FBF8C;
  --sun:#E9CB45; --sun-on:#221C00; --sun-soft:#353016; --sun-ink:#F0DA80;
  --ok-bg:#1C3325; --ok:#8AD6A6; --warn-bg:#3A3016; --warn:#F2C766; --bad-bg:#3E201C; --bad:#FF907F;
  --tomato:#FF7A63; --sunicon:#F5B93A; --moonicon:#ABA3E6;
  --c1:#6FBF8C; --c2:#EDB257; --c3:#FF7A63; --c4:#7EAFE3; --c5:#B396E2; --c6:#9AAA9F; --c7:#5CC7BF; --c8:#E58BBB;
  --shadow:none; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance}
.in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,.money{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.small{font-size:13px}
svg.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* header */
.top .in{display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.logo{width:44px;height:44px;border-radius:50%;background:var(--mint);border:1px solid var(--mint2);display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px}
.brand{flex:1;min-width:0;line-height:1.25}
.brand b{display:block;font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:10.5px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;align-items:center;gap:6px;flex:none}
.gen{border:1.5px solid var(--ink)!important;border-radius:12px}
@media (max-width:520px){.brand b{font-size:16px}.brand small{font-size:9px;letter-spacing:.1em}.gen .lbl-long{display:none}.logo{width:38px;height:38px}}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs .in{display:flex;gap:8px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
.tabs .in::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;color:var(--ink2);cursor:pointer;white-space:nowrap;text-decoration:none}
.tab:hover{border-color:var(--mint2)}
.tab[aria-current="page"]{background:var(--sun);border-color:var(--sun);color:var(--sun-on)}

main.in{padding-block:18px 28px;display:grid;gap:16px}
.foot{padding-block:4px 32px;color:var(--mute);font-size:12.5px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.foot button{background:none;border:0;padding:0;color:var(--green);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* generic */
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.span2{grid-column:1/-1}
.cols.even{align-items:stretch}
.stack{display:grid;gap:16px;min-width:0}
@media (max-width:780px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:16.5px;margin:0;font-weight:800;flex:1;min-width:8em}
.card-h .lead{flex-basis:100%;margin:-6px 0 0 42px}
.bubble{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sun-soft);color:var(--sun-ink);flex:none}
.bubble.g{background:var(--mint);color:var(--green)}
.bubble svg.ic{width:18px;height:18px}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--mint);color:var(--ok);white-space:nowrap;font-weight:700}
.lead{color:var(--ink2);margin:0 0 12px;font-size:14px}
.page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-title h2{margin:0;font-family:var(--f-display);font-size:clamp(22px,3.6vw,28px);font-weight:400;letter-spacing:.02em}
.page-title p{margin:2px 0 0;color:var(--ink2);font-size:14px}
.hl{background:linear-gradient(transparent 58%,var(--sun) 58%,var(--sun) 92%,transparent 92%);padding:0 2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:14px;line-height:1;padding:10px 14px;border-radius:12px;cursor:pointer;min-height:42px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--card2)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.soft{background:var(--mint);border-color:var(--mint2);color:var(--green)}
.btn.danger{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.btn.sm{min-height:34px;padding:7px 11px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:0;background:transparent;color:var(--ink2);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--card2);color:var(--ink)}
.icon-btn svg.ic{width:20px;height:20px}
.icon-btn.sm{width:34px;height:34px}
.icon-btn.sm svg.ic{width:17px;height:17px}
.icon-btn.armed{background:var(--bad-bg);color:var(--bad)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

input[type=text],input[type=number],input[type=date],input[type=search],input[type=month],select,textarea{font-size:16px;line-height:1.3;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-height:44px;width:100%;min-width:0}
textarea{min-height:110px;font-size:13px;font-family:ui-monospace,Menlo,monospace;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--leaf);outline-offset:-1px}
.field{display:grid;gap:6px;font-size:13px;color:var(--ink2);font-weight:600;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.form{display:grid;gap:14px}
.hint{font-size:12.5px;color:var(--mute);margin:0}
.check-row{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.check-row input{width:18px;height:18px;accent-color:var(--green)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer;user-select:none;line-height:1.2}
.chip:hover{border-color:var(--mint2)}
.chip input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.chip.on,.chip:has(input:checked){background:var(--green);border-color:var(--green);color:var(--green-ink)}
.chip:has(input:focus-visible){outline:2px solid var(--leaf);outline-offset:2px}

.bar{height:10px;border-radius:999px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--leaf);min-width:2px}
.bar.bad>i{background:var(--tomato)}
.bar.thin{height:8px}

.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap;line-height:1.35}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.mute{background:var(--card2);color:var(--mute)}

.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--mute);font-size:14px;display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink2);font-size:15px}

.sample{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;justify-content:space-between;background:var(--sun-soft);border:1px dashed var(--sun-ink);border-radius:14px;padding:10px 14px;font-size:13.5px;color:var(--sun-ink)}
.sample b{font-weight:800}

/* hero */
.hero{display:flex;align-items:center;gap:18px;background:var(--mint);border:1px solid var(--mint2);border-radius:22px;padding:24px 26px;overflow:hidden}
.hero-text{flex:1;min-width:0}
.hero-date{margin:0;font-size:13px;font-weight:700;color:var(--green)}
.hero h1{font-family:var(--f-display);font-size:clamp(23px,4.4vw,34px);line-height:1.3;margin:6px 0 6px;font-weight:400;letter-spacing:.02em}
.hero-sub{margin:0 0 14px;color:var(--ink2)}
.marker{display:inline-block;font-size:13px;font-weight:800;padding:5px 12px;background:var(--sun);color:var(--sun-on);border-radius:8px;transform:rotate(-1.2deg)}
.hero-ill{width:min(250px,36%);flex:none;height:auto}
@media (max-width:540px){.hero{padding:18px;gap:10px}.hero-ill{width:32%}}
.i-paper{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
.i-line{stroke:var(--mute);stroke-width:2;stroke-linecap:round;fill:none}
.i-check{stroke:var(--green);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.i-bowl{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
.i-stripe{stroke:var(--c4);stroke-width:3.2;stroke-linecap:round}
.i-soup{fill:var(--tomato);stroke:var(--ink);stroke-width:1.6}
.i-egg{fill:var(--sun)}
.i-pea{fill:var(--leaf)}
.i-pot{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
.i-leaf{fill:var(--leaf);stroke:var(--ink);stroke-width:1.4}
.i-hand{font-family:var(--f-hand);font-size:24px;font-weight:700;fill:var(--ink)}

/* money */
.money{font-size:34px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.money.bad{color:var(--bad)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.trio>div{padding:0 10px;border-left:1px solid var(--line);min-width:0}
.trio>div:first-child{border-left:0;padding-left:0}
.trio span{display:block;font-size:12px;color:var(--mute);line-height:1.35;margin-bottom:2px}
.trio b{font-size:15.5px;font-weight:800;font-variant-numeric:tabular-nums}
@media (max-width:420px){.trio b{font-size:14px}}

/* food */
.mini-foods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini-food{background:var(--card2);border-radius:14px;padding:10px;display:flex;align-items:center;gap:10px;min-width:0;border:1px solid transparent;cursor:pointer;text-align:left;font:inherit;color:inherit}
.mini-food:hover{border-color:var(--mint2)}
.mini-food .emo{font-size:26px;line-height:1;flex:none}
.mini-food b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-food span{display:block;font-size:12px;color:var(--mute)}
.mini-food.warn{background:var(--warn-bg)}
.mini-food.bad{background:var(--bad-bg)}
@media (max-width:420px){.mini-foods{grid-template-columns:repeat(2,minmax(0,1fr))}}
.note{margin:12px 0 0;padding:8px 12px;border-radius:10px;background:var(--sun-soft);color:var(--sun-ink);font-size:12.5px;font-weight:600}

.food-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.food{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;display:grid;gap:2px;cursor:pointer;min-width:0}
.food:hover{border-color:var(--mint2)}
.food .emo{font-size:34px;line-height:1.1;margin-bottom:6px}
.food .tag{position:absolute;top:12px;right:12px}
.food .nm{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:36px}
.food .nm small{font-weight:700;font-size:14px;color:var(--ink2);margin-left:4px}
.food .exp{font-size:12px;color:var(--mute);padding-right:34px;line-height:1.4}
.food .minus{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.food .minus:hover{color:var(--ink);border-color:var(--mint2)}
.food.out{opacity:.7}

/* recipe suggestions + lists */
.list{display:grid;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--card);min-width:0}
.li:last-child{border-bottom:0}
button.li{width:100%;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
button.li:last-child{border-bottom:0}
button.li:hover{background:var(--card2)}
.li .emo{font-size:26px;line-height:1;flex:none;width:34px;text-align:center}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:14.5px}
.li .tx small{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ledger */
.tiles2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.tile span{display:block;font-size:12.5px;color:var(--mute);font-weight:600}
.tile b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.mint{background:var(--mint);border-color:var(--mint2)}
.tile.mint b{font-size:28px}
.tile.bad b{color:var(--bad)}
.cat-bars{display:grid;gap:14px}
.cat-bar .between{font-size:14px;margin-bottom:6px}
.cat-bar .between b{font-weight:800}
.cat-bar .between span{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px}
.cat-bar .over{color:var(--bad);font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.month-nav{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px}
.month-nav b{min-width:7.5em;text-align:center;font-size:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg label{position:relative;text-align:center;padding:8px 6px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink2)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.amount-in{font-size:26px!important;font-weight:800;font-variant-numeric:tabular-nums;min-height:54px!important}
.day-h{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mute);font-weight:700;padding:12px 2px 6px}
.rec{display:flex;align-items:center;gap:10px;padding:10px 8px;margin:0 -8px;border-bottom:1px dashed var(--line);border-radius:10px;cursor:pointer}
.rec:hover{background:var(--card2)}
.rec-go{color:var(--mute);display:grid;place-items:center;width:24px;flex:none}
.rec-go svg.ic{width:16px;height:16px}
.tag-btn{border:0;cursor:pointer;margin-left:6px}
.rec:last-child{border-bottom:0}
.rec .tx{flex:1;min-width:0}
.rec .tx b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.rec .tx small{color:var(--mute);font-size:12px}
.rec .amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.rec .amt.in{color:var(--ok)}
.rec .amt.save{color:var(--c4)}

/* meals */

      .sort(function(a,b){ return a.expire < b.expire ? -1 : 1; })

    SLOTS.forEach(function(sl){
      var e = out[day][sl[0]];
      if (!e || !e.r || !RMAP[e.r]) return;
      if (opt.keep || opt.slots.indexOf(sl[0]) < 0){ consume(vf, RMAP[e.r], day); used[e.r] = i; }
    });
  });
  days.forEach(function(day, i){
    var w = parse(day).getDay(), weekend = w === 0 || w === 6;

      var k = sl[0];

      var e = out[day][k];
      if (e && (e.t || opt.keep)) return;
      var best = null, bs = -Infinity;

        if (r.m.indexOf(k) < 0) return;
        var s = 0;
        r.ing.forEach(function(g){
          var have = vf.filter(function(f){ return f.name === g[0] && f.qty > 0 && f.expire >= day; });
          if (have.length){ var left = Math.min.apply(null, have.map(function(f){ return diffDays(f.expire, day); })); s += 3 + Math.max(0, 5 - left) * 1.3; }

        if (!need[key]){ need[key] = {n:g[0], u:g[2], a:0, from:[]}; order.push(key); }
        need[key].a += g[1];
        if (need[key].from.indexOf(r.n) < 0) need[key].from.push(r.n);
      });
    });
  }
  var res = [];
  order.forEach(function(key){
    var x = need[key], miss = x.a - haveSame(x.n, x.u);
    if (miss > 0.001) res.push({n:x.n, u:x.u, a:roundBuy(miss, x.u), from:x.from.slice(0,2).join('、')});
  });
  return res;
}
function missingFor(r){
  var res = [];
  r.ing.forEach(function(g){
    if (SKIP_BUY[g[0]]) return;
    var miss = g[1] - haveSame(g[0], g[2]);
    if (miss > 0.001) res.push({n:g[0], u:g[2], a:roundBuy(miss, g[2]), from:r.n});
  });
  return res;
}
function addShop(items){
  var added = 0;
  items.forEach(function(x){
    var ex = S.shop.find(function(s){ return !s.done && s.n === x.n; });
    if (ex){ if (x.from && ex.from.indexOf(x.from) < 0) ex.from = ex.from ? ex.from + '、' + x.from : x.from; return; }
    S.shop.push({id:uid(), n:x.n, a:x.a, u:x.u, q:'', from:x.from||'', done:false}); added++;
  });
  return added;
}
function shopQty(x){ return x.a != null && x.a > 0 ? fmtQty(x.a, x.u) : (x.q || ''); }
function cook(r){
  var used = [], ym = monthOf(today());
  r.ing.forEach(function(g){
    var need = g[1], took = 0;
    S.fridge.filter(function(f){ return f.name === g[0] && f.unit === g[2] && f.qty > 0; })
      .sort(function(a,b){ return a.expire < b.expire ? -1 : 1; })
      .forEach(function(f){ if (need <= 0) return; var take = Math.min(need, f.qty); f.qty = r2(f.qty - take); need = r2(need - take); took = r2(took + take); });
    if (took > 0) used.push(g[0] + ' ' + fmtQty(took, g[2]));
  });
  var before = S.fridge.length;
  S.fridge = S.fridge.filter(function(f){ return f.qty > 0.0001; });
  stat(ym).used += before - S.fridge.length;
  return used;
}

/* fridge */

    '<div class="chips" style="margin-bottom:14px">' + [['all','全部'],['soon','快过期'],['冷藏','冷藏'],['冷冻','冷冻'],['常温','常温']].map(function(o){

  } else html += '<div class="empty"><b>' + (all.length ? '这一类里没有食材' : '冰箱还是空的') + '</b>' + (all.length ? '' : '买菜回来记一下，到期前会提醒你先吃。') + '<button class="btn sm primary" data-a="food-add">' + ic('plus') + '添加食材</button></div>';

  html += '<article class="card"><header class="card-h"><span class="bubble">' + ic('bowl') + '</span><h2>用冰箱里的东西，能做这些</h2></header>';

    return '<button class="li" data-a="recipe" data-r="' + x.r.id + '"><span class="emo">' + x.r.e + '</span><span class="tx"><b>' + esc(x.r.n) + '</b><small>约 ' + x.r.t + ' 分钟 · ' + x.r.tags.join(' · ') + '</small></span>' +

    '<h4>做法</h4><ol class="steps">' + r.st.map(function(s){ return '<li><span>' + esc(s) + '</span></li>'; }).join('') + '</ol>' +

}

    days.map(function(d){
      var dm = S.meals[d] || {};
      return '<tr' + (d === day ? ' class="on"' : '') + '><td data-a="meal-day" data-day="' + d + '">' + md(d) + '<small>' + (d === t ? '今天' : wkShort(d)) + '</small></td>' + SLOTS.map(function(sl){
        var e = dm[sl[0]], r = e && e.r && RMAP[e.r];
        return '<td class="cell" data-a="meal-cell" data-day="' + d + '" data-k="' + sl[0] + '">' + (r ? r.e + ' ' + esc(r.n) : e && e.t ? '🍱 ' + esc(e.t) : '<span class="mute">—</span>') + '</td>';

                      : '<p class="hint" style="margin-top:12px">从今天起这周要用的食材，冰箱和采购清单里都有了。</p>';
  html += '</article></div>';

/* todos */
function todoRow(x, compact){
  var t = today();
  if (!compact && view.editTodo === x.id){
    return '<form class="todo-edit" data-f="todo-edit" data-id="' + x.id + '"><input type="text" name="t" value="' + esc(x.t) + '" required aria-label="待办内容"><input type="date" name="d" value="' + x.d + '" aria-label="日期"><select name="rep" aria-label="重复">' + repOpts(x.rep) + '</select><button class="btn sm primary" type="submit">保存</button><button class="btn sm" type="button" data-a="todo-cancel">取消</button></form>';
  }
  var meta = '';
  if (!x.done && x.d < t) meta += '<span class="tag bad">逾期 · ' + md(x.d) + '</span>';
  else if (x.d > t) meta += '<span class="tag mute">' + md(x.d) + '</span>';
  else if (!compact && view.todoFilter !== 'today' && x.d === t) meta += '<span class="tag ok">今天</span>';
  if (x.rep) meta += '<span class="tag mute">' + (x.rep === 'daily' ? '每天' : '每周') + '</span>';
  return '<div class="todo' + (x.done ? ' done' : '') + '"><button class="check' + (x.done ? ' on' : '') + '" data-a="todo-toggle" data-id="' + x.id + '" aria-pressed="' + x.done + '" aria-label="' + (x.done ? '标记为没做完' : '标记为做完') + '：' + esc(x.t) + '">' + ic('check') + '</button>' +
    '<div class="tx"><span>' + esc(x.t) + '</span>' + (meta ? '<span class="meta">' + meta + '</span>' : '') + '</div>' +
    (compact ? '' : '<button class="icon-btn sm" data-a="todo-del" data-id="' + x.id + '" aria-label="删除">' + ic('trash') + '</button><button class="icon-btn sm" data-a="todo-edit" data-id="' + x.id + '" aria-label="编辑">' + ic('edit') + '</button>') + '</div>';
}
function repOpts(v){ return [['','不重复'],['daily','每天'],['weekly','每周']].map(function(o){ return '<option value="' + o[0] + '"' + (v === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join(''); }
function renderTodo(){
  var t = today(), f = view.todoFilter, list;
  if (f === 'today') list = todayTodos();
  else if (f === 'open') list = S.todos.filter(function(x){ return !x.done; }).sort(todoSort);
  else list = S.todos.slice().sort(function(a,b){ return a.d < b.d ? -1 : a.d > b.d ? 1 : (a.done === b.done ? 0 : a.done ? 1 : -1); });
  var tl = todayTodos(), done = tl.filter(function(x){ return x.done; }).length, pct = tl.length ? Math.round(done / tl.length * 100) : 0;
  var cheer = !tl.length ? '今天很轻松' : pct === 100 ? '今天的事都做完了，歇会儿' : pct >= 60 ? '快做完了' : pct > 0 ? '继续加油！' : '从最小的一件开始';
  var html = '<div class="page-title"><div><h2><span class="hl">懒得记的琐事，</span>也帮你列好了</h2><p>换床单、洗衣服、整理房间、采购日用品……做完直接打勾。</p></div></div>';
  html += '<div class="todo-grid"><article class="card"><header class="card-h"><h2>做完一件，就轻松一点。</h2></header>' +
    '<form class="todo-add" data-f="todo-add" autocomplete="off"><input type="text" id="td-text" name="t" placeholder="想到什么就记下来，比如：换床单" required aria-label="待办内容"><input type="date" name="d" value="' + t + '" aria-label="日期"><select name="rep" aria-label="重复">' + repOpts('') + '</select><button class="btn primary" type="submit">' + ic('plus') + '新增待办</button></form>' +
    '<div class="chips" style="margin:10px 0 14px"><span class="small mute" style="align-self:center">常做的：</span>' + QUICK_TODOS.map(function(q){ return '<button class="chip" data-a="todo-quick" data-t="' + esc(q) + '">+ ' + esc(q) + '</button>'; }).join('') + '</div>' +
    '<div class="chips" style="margin-bottom:12px">' + [['today','今天'],['open','全部未完成'],['all','全部日期']].map(function(o){ return '<button class="chip' + (f === o[0] ? ' on' : '') + '" data-a="todo-filter" data-f="' + o[0] + '">' + o[1] + '</button>'; }).join('') + '</div>';
  if (list.length){
    if (f === 'all'){
      var groups = {}, order = [];
      list.forEach(function(x){ if (!groups[x.d]){ groups[x.d] = []; order.push(x.d); } groups[x.d].push(x); });
      html += order.map(function(d){ return '<div class="day-h"><span>' + md(d) + ' ' + wkShort(d) + (d === t ? ' · 今天' : '') + '</span></div><div class="list">' + groups[d].map(function(x){ return todoRow(x); }).join('') + '</div>'; }).join('');
    } else html += '<div class="list">' + list.map(function(x){ return todoRow(x); }).join('') + '</div>';
  } else html += '<div class="empty"><b>' + (f === 'today' ? '今天没有待办' : '没有待办') + '</b>在上面写一件，或者点一个常做的小事。</div>';

    '<article class="card"><p class="hand">一点点完成，<br>生活也会变轻松。</p><p class="hint" style="margin-top:8px">设成「每天」或「每周」的事，打勾后会自动排到下一次。</p></article></div></div>';
  return html;
}

function budgetSum(){
  var el = $('#bd-sum'); if (!el) return;
  var f = el.closest('form'), s = $$('#bd-rows input[name=cb]').reduce(function(a,i){ return a + num(i.value); }, 0), tot = $('#bd-total');
  if (tot && document.activeElement !== tot) tot.value = r2(s);

var budgetBase = null;
function scaleBudget(total){
  var ins = $$('#bd-rows input[name=cb]'), f = $('form[data-f=budget]'); if (!ins.length || !f) return;
  if (!budgetBase || budgetBase.length !== ins.length) budgetBase = ins.map(function(i){ return num(i.value); });
  var unit = f.dataset.cur === 'KRW' ? 1000 : 1, sum = budgetBase.reduce(function(a,b){ return a + b; }, 0);
  var out = budgetBase.map(function(v){ return Math.round((sum > 0 ? v / sum : 1 / ins.length) * total / unit) * unit; });
  out[out.length - 1] = Math.max(0, r2(out[out.length - 1] + total - out.reduce(function(a,b){ return a + b; }, 0)));
  ins.forEach(function(i, k){ i.value = out[k]; });
  budgetSum();
}

function toast(msg, undo){
  var el = $('#toast');
  el.textContent = msg;
  if (undo){ var b = document.createElement('button'); b.type = 'button'; b.className = 'toast-btn'; b.textContent = '撤销'; b.onclick = function(){ el.hidden = true; undo(); }; el.appendChild(b); }
  el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.hidden = true; }, undo ? 8000 : 2600);
}

/* ---------------- actions ---------------- */
function setTab(t){
  if (!TABS.some(function(x){ return x[0] === t; })) t = 'home';
  view.tab = t; view.editTodo = null;
  render();
}
function go(t){
  closeSheet();
  if (location.hash !== '#' + t){ try { location.hash = t; } catch(e){} }
  setTab(t);
  window.scrollTo({top:0, behavior:'auto'});
}
function arm(el, fn){
  if (el.dataset.armed === '1'){ fn(); return; }
  el.dataset.armed = '1'; el.classList.add('armed');
  var old = el.getAttribute('aria-label') || '';
  el.setAttribute('aria-label', '再点一次确认删除');
  if (el.classList.contains('btn')){ el.dataset.txt = el.innerHTML; el.textContent = '再点一次确认'; }
  setTimeout(function(){ if (!document.contains(el)) return; el.dataset.armed = ''; el.classList.remove('armed'); el.setAttribute('aria-label', old); if (el.dataset.txt) el.innerHTML = el.dataset.txt; }, 3000);
}
function removeFood(id, wasted){
  var f = S.fridge.find(function(x){ return x.id === id; }); if (!f) return;
  S.fridge = S.fridge.filter(function(x){ return x.id !== id; });
  stat(monthOf(today()))[wasted ? 'wasted' : 'used']++;
  closeSheet(); commit('fridge','settings');
  toast(wasted ? f.name + ' 扔掉了，下次少买一点' : f.name + ' 吃完了');
}
function setMeal(day, k, val){
  S.meals[day] = Object.assign({}, S.meals[day] || {});
  if (val) S.meals[day][k] = val; else delete S.meals[day][k];
}
function copyText(text, okMsg){
  function fallback(){
    openSheet(sheetHead('复制下面的内容') + '<textarea id="copy-box" readonly style="min-height:240px">' + esc(text) + '</textarea><p class="hint">长按或全选后复制。</p>');
    var box = $('#copy-box'); if (box){ box.focus(); box.select(); }
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ toast(okMsg); }, fallback);
    else fallback();
  } catch(e){ fallback(); }
}
function importData(text, mode){
  var data;
  try { data = JSON.parse(text); } catch(e){ toast('这段内容不是有效的备份，检查一下有没有复制完整'); return; }
  if (!isObj(data) || !(Array.isArray(data.ledger) || Array.isArray(data.fridge) || Array.isArray(data.todos))){ toast('这段内容里没有找到账本、冰箱或待办数据'); return; }
  var inc = normalize(data);
  if (mode === 'merge'){ var r = mergeData(S, inc); Undo.label = '合并备份'; S = r.s; closeSheet(); commit(); toast(r.msg); }
  else { Undo.label = '用备份替换'; S = inc; closeSheet(); commit(); toast('恢复好了'); }
}
function readBackup(mode){
  var file = $('#bk-file') && $('#bk-file').files[0], text = $('#bk-text') ? $('#bk-text').value.trim() : '';
  if (file){ var rd = new FileReader(); rd.onload = function(){ importData(String(rd.result || ''), mode); }; rd.onerror = function(){ toast('文件读不出来，换一个试试'); }; rd.readAsText(file); return; }
  if (!text){ toast('先粘贴备份内容，或者选一个备份文件'); return; }
  importData(text, mode);
}

    var names = catNames();
    r.type = type; r.cur = cur; r.amount = amount;
    r.cat = type === 'out' ? (fd.get('cat') || (names.indexOf(r.cat) >= 0 ? r.cat : guessCat(r.note || ''))) : type === 'in' ? '收入' : '储蓄';
    r.pay = fd.get('pay') || ''; r.note = String(fd.get('note') || '').trim(); r.date = fd.get('date') || r.date;
    Undo.label = '修改「' + (r.note || r.cat) + '」'; view.month = monthOf(r.date);
    closeSheet(); commit('ledger'); toast('改好了');
  },
  'move-cat': function(f){
    var from = f.dataset.from, to = new FormData(f).get('to');
    if (!to){ toast('先选一类'); return; }
    var n = 0; S.ledger.forEach(function(r){ if (r.type === 'out' && r.cat === from){ r.cat = to; n++; } });
    Undo.label = '把「' + from + '」改到「' + to + '」'; closeSheet(); commit('ledger');
    toast(n + ' 笔账改到了「' + to + '」');
  },
  gen: function(f){
    var fd = new FormData(f), slots = fd.getAll('slots'), tags = fd.getAll('tags'), maxTime = +fd.get('maxTime') || 20;
    if (!slots.length){ toast('至少选一顿'); return; }
    S.settings.prefs = {slots:slots, maxTime:maxTime, tags:tags};
    var t = today();
    S.meals = planWeek(S.fridge, S.meals, {start:t, slots:slots, maxTime:maxTime, tags:tags, keep:!!fd.get('keep')});
    var n = 0; if (fd.get('shop')) n = addShop(weekNeeds(t));
    view.mealStart = t; view.mealDay = t;
    closeSheet(); commit('meals','shop','settings'); go('meals');
    toast('排好了 7 天的菜单' + (n ? '，采购清单新增 ' + n + ' 样' : ''));
  },
  'pick-custom': function(f){ var p = view.pick; var txt = String(new FormData(f).get('t') || '').trim(); if (!p || !txt) return; setMeal(p.day, p.k, {t:txt}); view.mealDay = p.day; view.mealSlot = p.k; closeSheet(); commit('meals'); },
  bought: function(f){
    var fd = new FormData(f), t = today(), moved = [];
    S.shop.filter(function(x){ return x.done; }).forEach(function(x){
      if (!fd.get('in-' + x.id)) return;
      var c = FOODS[x.n], qty = x.a, unit = x.u;
      if (qty == null || !(qty > 0)){ var m = String(x.q || '').match(/^\s*([\d.]+)\s*(.*)$/); qty = m ? num(m[1]) : 1; unit = m && m[2] ? m[2].trim() : (c ? c[1] : '份'); }
      var same = S.fridge.find(function(f2){ return f2.name === x.n && f2.unit === unit && f2.expire === (fd.get('exp-' + x.id) || t); });
      if (same) same.qty = r2(same.qty + qty);
      else S.fridge.push({id:uid(), name:x.n, emoji:c ? c[0] : '🍽️', qty:qty, unit:unit || (c ? c[1] : '份'), expire:fd.get('exp-' + x.id) || addDays(t, 7), place:c ? c[3] : '冷藏', added:t});
      moved.push(x.n);
    });
    var bcur = fd.get('cur') === 'CNY' ? 'CNY' : 'KRW', amount = amountOf(fd.get('amount'), bcur);
    if (amount > 0) S.ledger.push({id:uid(), date:t, type:'out', cat:String(fd.get('cat') || '买菜做饭'), amount:amount, cur:bcur, pay:'', note:'采购：' + S.shop.filter(function(x){ return x.done; }).map(function(x){ return x.n; }).slice(0,6).join(' ')});
    S.shop = S.shop.filter(function(x){ return !x.done; });
    closeSheet(); commit('shop','fridge','ledger');
    toast((moved.length ? moved.length + ' 样收进冰箱' : '清单整理好了') + (amount > 0 ? '，记账 ' + fmtC(amount, bcur) : ''));
  },
  'todo-add': function(f){
    var fd = new FormData(f), txt = String(fd.get('t') || '').trim(); if (!txt) return;
    S.todos.push({id:uid(), t:txt, d:fd.get('d') || today(), done:false, doneAt:'', rep:fd.get('rep') || ''});
    commit('todos'); toast('加上了：' + txt);
    var inp = $('#td-text'); if (inp) inp.focus({preventScroll:true});
  },
  'todo-edit': function(f){
    var fd = new FormData(f), x = S.todos.find(function(i){ return i.id === f.dataset.id; }); if (!x) return;
    var txt = String(fd.get('t') || '').trim(); if (!txt) return;
    x.t = txt; x.d = fd.get('d') || x.d; x.rep = fd.get('rep') || '';
    view.editTodo = null; commit('todos');
  },
  'shop-add': function(f){
    var fd = new FormData(f), n = String(fd.get('n') || '').trim(); if (!n) return;
    var q = String(fd.get('q') || '').trim(), m = q.match(/^\s*([\d.]+)\s*(.*)$/), c = FOODS[n];
    var item = {id:uid(), n:n, a:null, u:'', q:q, from:'', done:false};
    if (m){ item.a = num(m[1]); item.u = m[2].trim() || (c ? c[1] : ''); item.q = ''; }
    S.shop.push(item); commit('shop');
    var inp = $('#sh-name'); if (inp) inp.focus({preventScroll:true});
  }
};

var UNDO_LABELS = { 'todo-toggle':'勾选待办', 'todo-quick':'添加待办', 'shop-toggle':'勾选采购清单', 'shop-clear':'清掉已买的', 'shop-week':'加入采购清单', 'recipe-shop':'加入采购清单',
  'food-minus':'用掉食材', 'food-done':'吃完食材', 'food-waste':'扔掉食材', 'cook':'做菜扣库存', 'pick-set':'换菜', 'pick-clear':'清空这顿', 'auto-one':'安排一道菜', 'plan-it':'放进菜单', 'bk-wipe':'清空所有数据' };
var UNDO_FORMS = { ledger:'记一笔', review:'记账', food:'改食材', budget:'改预算', gen:'生成菜单', 'pick-custom':'改这顿', bought:'收进冰箱', 'todo-add':'添加待办', 'todo-edit':'改待办', 'shop-add':'添加采购清单', rate:'改汇率' };
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-a]'); if (!el) return;
  var fn = A[el.dataset.a]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  Undo.label = UNDO_LABELS[el.dataset.a] || '';
  fn(el, e);
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !$('#sheet').hidden){ closeSheet(); return; }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'say-in'){ e.preventDefault(); e.target.form.requestSubmit(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-a], label[for=photo-in]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', function(e){
  var f = e.target.closest('form[data-f]'); if (!f) return;
  e.preventDefault();
  Undo.label = UNDO_FORMS[f.dataset.f] || '';
  var fn = F[f.dataset.f]; if (fn) fn(f);
});
document.addEventListener('paste', function(e){
  if (!e.target || e.target.id !== 'clip-box') return;
  var t = e.clipboardData ? e.clipboardData.getData('text') : '';
  if (t && t.trim()){ e.preventDefault(); processShotText(t); }
});
document.addEventListener('focusin', function(e){ if (e.target.id === 'bd-total') budgetBase = null; });
document.addEventListener('input', function(e){
  var el = e.target;
  if (el.id === 'q') doSearch(el.value);
  else if (el.id === 'fd-name'){
    var form = el.closest('form'); if (!form || form.dataset.id) return;
    var c = FOODS[el.value.trim()];
    if (c){ $('#fd-emoji').value = c[0]; $('#fd-unit').value = c[1]; $('#fd-place').value = c[3]; $('#fd-exp').value = addDays(today(), c[2]); $('#fd-hint').textContent = el.value.trim() + '一般' + c[3] + '能放 ' + c[2] + ' 天，到期日已经帮你填好。'; }
  }
  else if (el.name === 'cb'){ budgetBase = null; budgetSum(); }
  else if (el.id === 'bd-total') scaleBudget(num(el.value));
});
document.addEventListener('change', function(e){
  var el = e.target;
  if (el.id === 'photo-in'){ var files = Array.prototype.slice.call(el.files || []); el.value = ''; if (files.length) recognize(files); return; }
  if (el.name === 'bcur'){
    var form = el.closest('form'), from = form.dataset.cur, to = el.value;
    if (from && from !== to){
      $$('input[name=cb]', form).concat($$('input[name=saveGoal]', form)).forEach(function(i){ i.value = roundCur(conv(num(i.value), from, to), to); });
      form.dataset.cur = to; budgetSum();
    }
    return;
  }
  if (el.name === 'type' && el.closest('form[data-f=ledger]')){
    view.lgType = el.value;
    $('#lg-cats').hidden = el.value !== 'out';
    $('#lg-note').placeholder = el.value === 'in' ? '比如：工资' : el.value === 'save' ? '比如：转入存款' : '比如：超市买菜';
  }
  if (el.name === 'cur' && el.closest('form[data-f=ledger]')) view.lgCur = el.value;
  if (el.name === 'type' && el.closest('form[data-f=rec-edit]')){ var rc = $('#re-cats'); if (rc) rc.hidden = el.value !== 'out'; }
  if (el.name === 'cat' && el.closest('form[data-f=ledger]')) view.lgCat = el.value;
});
window.addEventListener('hashchange', function(){ if (handleShot()) return; var h = location.hash.slice(1); if (h && h !== view.tab) setTab(h); });
function refreshIfNewDay(){ if (view.day !== today()){ view.mealStart = today(); view.mealDay = today(); render(); } }
window.addEventListener('focus', refreshIfNewDay);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) refreshIfNewDay(); });

/* ---------------- boot ---------------- */
S = loadLocal() || sampleState();
undoInit();
var h0 = location.hash.slice(1);
if (TABS.some(function(t){ return t[0] === h0; })) view.tab = h0;
if (!handleShot()) render();
initCloud();
initVision();
})();
</script>
