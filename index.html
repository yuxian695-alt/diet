<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>饮食助手</title>
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="饮食助手">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --ink:#000; --ink2:rgba(60,60,67,.85); --mute:rgba(60,60,67,.6); --line:rgba(60,60,67,.18);
  --tint:#248A3D; --tintFill:#34C759; --tintSoft:rgba(52,199,89,.14);
  --orange:#C93400; --orangeSoft:rgba(255,149,0,.16);
  --kcal:#FF2D55; --prot:#30B550; --fib:#0A84FF; --carb:#FF9500; --fat:#AF52DE;
  --bar:rgba(249,249,249,.82); --shadow:0 1px 2px rgba(0,0,0,.04);
  --p:var(--prot); --c:var(--carb); --f:var(--fat); --fi:var(--fib); --acc:var(--tint); --acc2:var(--tintSoft);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000; --card:#1C1C1E; --card2:#2C2C2E; --ink:#fff; --ink2:rgba(235,235,245,.85); --mute:rgba(235,235,245,.6); --line:rgba(84,84,88,.6);
  --tint:#30D158; --tintFill:#30D158; --tintSoft:rgba(48,209,88,.18); --orange:#FF9F0A; --orangeSoft:rgba(255,159,10,.2);
  --kcal:#FF375F; --prot:#30D158; --fib:#0A84FF; --bar:rgba(22,22,24,.82);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Apple SD Gothic Neo","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
body{padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}
main{max-width:600px;margin:0 auto;padding:8px 16px 28px}
h1{font-size:32px;font-weight:700;letter-spacing:.2px;margin:10px 0 2px}
h2{font-size:20px;font-weight:700;margin:26px 4px 8px}
.sub{color:var(--mute);font-size:15px}
.sec{font-size:13px;color:var(--mute);margin:22px 16px 6px}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.muted{color:var(--mute)}.small{font-size:13.5px}.hidden{display:none}
b{font-weight:600}
/* buttons */
.btn{appearance:none;border:0;border-radius:12px;padding:12px 18px;font:600 16px/1.2 inherit;font-family:inherit;background:var(--tintFill);color:#fff;cursor:pointer;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.ghost{background:var(--tintSoft);color:var(--tint)}
.btn.gray{background:var(--card2);color:var(--ink)}
.sheet .btn.gray{background:var(--card)}
.sheet textarea,.sheet input:not(.sw){background:var(--card)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:999px;white-space:nowrap}
.btn.white{background:var(--tintFill);color:#fff}.btn.ghost2{background:var(--card2);color:var(--ink)}
.btn:disabled{opacity:.4}
.tbtn{appearance:none;border:0;background:none;color:var(--tint);font:500 15px inherit;font-family:inherit;padding:6px 4px;cursor:pointer}
.chip{border:0;background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap;box-shadow:var(--shadow)}
.chip.on{background:var(--ink);color:var(--bg)}
input,select,textarea{font:inherit;font-size:16px;border:0;border-radius:10px;padding:10px 12px;background:var(--card2);color:var(--ink);width:100%;outline:none}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 2px var(--tintSoft)}
label{font-size:13px;color:var(--mute);display:block;margin:12px 0 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* switch */
input.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:31px;background:var(--line);position:relative;flex:none;padding:0;cursor:pointer;transition:background .2s}
input.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
input.sw:checked{background:var(--tintFill)}input.sw:checked::after{transform:translateX(20px)}
.swrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;font-size:16px}
/* tags */
.tag{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--tintSoft);color:var(--tint);margin:0 4px 0 0}
.tag.w{background:var(--orangeSoft);color:var(--orange)}
.macro{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.macro b{color:var(--ink)}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.note{background:var(--orangeSoft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.ok{background:var(--tintSoft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:10px 0 4px}
.dcell{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer}
.dcell .w{font-size:12px;color:var(--mute)}
.dcell .n{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.dcell.today .n{color:var(--tint);font-weight:700}
.dcell.sel .n{background:var(--ink);color:var(--bg)}
.dcell.today.sel .n{background:var(--tintFill);color:#fff}
.dcell .dot{width:5px;height:5px;border-radius:50%;background:transparent}.dcell .dot.on{background:var(--tintFill)}
/* rings */
.rings{display:flex;align-items:center;gap:18px}
.legend{flex:1;display:grid;gap:7px}
.lg .k{font-size:13px;color:var(--mute)}
.lg .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.lg .v span{font-size:13px;color:var(--mute);font-weight:500}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;padding-top:12px;border-top:.5px solid var(--line)}
.mini .t{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.mini .t b{color:var(--ink);font-variant-numeric:tabular-nums}
.mini .tr{height:5px;border-radius:5px;background:var(--card2);margin-top:5px;overflow:hidden}
.mini .fl{height:100%;border-radius:5px}
.stats{display:flex;gap:8px;margin:4px 0 2px}
.stat{flex:1;background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--mute)}.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
/* next-up widget */
.hero{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--shadow);position:relative;overflow:hidden}

.hero .small{color:var(--tint);font-weight:600;font-size:13px}
.hero .hname{font-size:22px;font-weight:700;margin:4px 0 4px;letter-spacing:-.3px}
.hero .desc{color:var(--ink2);font-size:15px}
.hero.bring .small{color:var(--orange)}
/* timeline */
.tl{position:relative;margin:6px 0 0 6px;padding-left:18px}
.tl::before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:1.5px;background:var(--line)}
.tli{position:relative;padding:5px 0;font-size:15px;display:flex;gap:10px;align-items:baseline}
.tli::before{content:"";position:absolute;left:-18px;top:11px;width:9px;height:9px;border-radius:50%;background:var(--tintFill);box-shadow:0 0 0 3px var(--card)}
.tli.cls::before{background:var(--line)}
.tli .tm{font-variant-numeric:tabular-nums;font-weight:600;width:48px;flex:none}
.tli.cls{color:var(--mute);font-size:14px}
/* meal card */
.mcard{background:var(--card);border-radius:16px;margin:12px 0;box-shadow:var(--shadow);overflow:hidden;transition:opacity .2s}
.mcard.eaten{opacity:.55}
.mhead{display:flex;gap:12px;align-items:flex-start;padding:14px 16px 6px}
.mhead .meta{font-size:13px;color:var(--mute);font-weight:500}
.mhead .mt{font-size:19px;font-weight:700;margin:2px 0 6px;letter-spacing:-.3px}
.cc{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:2px;padding:0}
.cc.on{background:var(--tintFill);border-color:var(--tintFill)}
.cc svg{width:16px;height:16px}
.ilist{margin:0 0 0 16px;border-top:.5px solid var(--line)}
.irow{display:flex;justify-content:space-between;align-items:center;padding:11px 16px 11px 0;border-bottom:.5px solid var(--line);font-size:16px;cursor:pointer}
.irow:last-child{border-bottom:0}
.irow:active{background:var(--card2)}
.irow .g{color:var(--mute);font-variant-numeric:tabular-nums;font-size:15px;display:flex;align-items:center;gap:6px}
.irow .chev{color:var(--line);font-size:15px}
.mfoot{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 12px 16px;border-top:.5px solid var(--line)}
.how{font-size:13.5px;color:var(--mute);padding:0 16px 12px}
.mbtns{display:flex;gap:6px}
.ibtn{width:32px;height:32px;border-radius:50%;border:0;background:var(--tintSoft);color:var(--tint);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(4px + env(safe-area-inset-bottom));z-index:9}
nav a{flex:1;text-align:center;font-size:10.5px;font-weight:500;color:var(--mute);text-decoration:none;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav a svg{width:26px;height:26px}
nav a.on{color:var(--tint)}
/* tables */
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:10px 4px;border-bottom:.5px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{color:var(--mute);font-weight:500;font-size:12.5px}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
a.cp{color:var(--tint);font-size:13.5px;text-decoration:none;white-space:nowrap}
.daybtn{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.daybtn:active{opacity:.7}
.drop{border:1.5px dashed var(--line);border-radius:16px;padding:28px 16px;text-align:center;color:var(--tint);background:var(--card);cursor:pointer;font-weight:500}
.drop img{max-width:100%;max-height:280px;border-radius:12px;margin-top:8px}
.steps li{margin:4px 0}
.check{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.check input{width:auto;margin-top:4px}
.dim{opacity:.45;text-decoration:line-through}
.status{font-size:12px;color:var(--mute);text-align:center;margin-top:16px}
.tip{font-size:14px;color:var(--ink2);background:var(--card);border-radius:14px;padding:12px 14px;margin:18px 0 8px;box-shadow:var(--shadow)}
.fitem{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:.5px solid var(--line);cursor:pointer;font-size:16px}
.srow{display:flex;align-items:center;gap:12px;padding:11px 16px 11px 0;border-bottom:.5px solid var(--line)}
.srow .nm{font-size:16px}.srow .sub2{font-size:12.5px;color:var(--mute);margin-top:1px}
.srow .qty{font-size:15px;font-variant-numeric:tabular-nums;font-weight:500}
.srow.done .nm{color:var(--mute);text-decoration:line-through}
.cc.small{width:24px;height:24px;margin:0}.cc.small svg{width:13px;height:13px}
.pill{background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px}
/* sheet */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
.modal .sheet{background:var(--bg);width:100%;max-width:600px;border-radius:14px 14px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.stitle{font-size:17px;font-weight:600}
.asheet{background:var(--card);border-radius:14px;overflow:hidden;margin-top:10px}
.asheet button{display:block;width:100%;border:0;background:none;padding:16px;font:400 18px inherit;font-family:inherit;color:var(--tint);border-bottom:.5px solid var(--line);cursor:pointer}
.asheet button:last-child{border-bottom:0}.asheet button.red{color:#FF3B30}
.asheet .ah{padding:12px 16px;font-size:13px;color:var(--mute);text-align:center;border-bottom:.5px solid var(--line)}
.cancel{margin-top:8px;font-weight:600!important}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}@keyframes fade{from{opacity:0}}
.hud{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:14.5px;font-weight:500;z-index:30;box-shadow:0 8px 30px rgba(0,0,0,.18);animation:drop .3s cubic-bezier(.2,.9,.3,1);max-width:90vw}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
.meal .time{font-size:13px;color:var(--mute)}
</style>
</head>

/* ============ 计算目标 ============ */
function targets(p){
 const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==="m"?5:-161);
 const tdee=bmr*ACTS[p.act][1];
 const bmi=p.w/Math.pow(p.h/100,2);
 let kcal=tdee, ppk=1.4; const notes=[];
 if(p.goal==="cut"){kcal=Math.max(tdee-400,bmr*1.05);ppk=2.0}
 if(p.goal==="bulk"){kcal=tdee+250;ppk=1.8}
 if(p.goal==="gain"){kcal=tdee+400;ppk=1.6}
 if(p.goal==="recomp"){ppk=2.0; if(bmi<18.5)kcal=tdee+150; else if(bmi>=25)kcal=tdee-250;}
 if(bmi<18.5 && (p.goal==="cut")) notes.push("BMI 偏低（"+bmi.toFixed(1)+"），不建议再减脂，改成“增肌”或“减脂增肌一起”更合适。");
 if(bmi<18.5 && p.goal==="recomp") notes.push("BMI "+bmi.toFixed(1)+" 偏瘦，身上可减的脂肪很少；所以热量设成比维持略高一点，重点是吃够蛋白质和做力量训练。");
 if((p.goal==="recomp"||p.goal==="bulk") && (p.act==="sed"||p.act==="stu")) notes.push("没有力量训练，多吃的蛋白质长不成肌肉。开始训练后把运动量改成“每周力量训练3–4次”，并勾选训练日。");
 if(bmi>=25 && (p.goal==="bulk"||p.goal==="gain")) notes.push("BMI "+bmi.toFixed(1)+" 偏高，建议先选“减脂增肌一起”。");
 const P=Math.round(ppk*p.w);
 const Fg=Math.round(Math.max(0.8*p.w,0.25*kcal/9));
 const C=Math.round((kcal-P*4-Fg*9)/4);
 return {bmr:Math.round(bmr),tdee:Math.round(tdee),bmi,kcal:Math.round(kcal),p:P,f:Fg,c:C,fi:Math.round(kcal/1000*14),notes};
}

/* ============ 营养计算 ============ */
function itemNut(it){ // it: [key,g] 或 {n,g,kcal,p,c,f,fi}（自定义，按整份）
 if(Array.isArray(it)){const f=F[it[0]];if(!f)return [0,0,0,0,0];const r=it[1]/100;return [f[3]*r,f[4]*r,f[5]*r,f[6]*r,f[7]*r]}
 return [it.kcal||0,it.p||0,it.c||0,it.f||0,it.fi||0];
}
function sumItems(items){const s=[0,0,0,0,0];items.forEach(it=>{const n=itemNut(it);for(let i=0;i<5;i++)s[i]+=n[i]});return s}
function roleOf(it){return Array.isArray(it)&&F[it[0]]&&!it[2]?F[it[0]][11]:""}
function roundG(key,g){if(key.startsWith("rice_"))return Math.max(10,Math.round(g/10)*10);return Math.max(5,Math.round(g/5)*5)}

/* 按目标缩放一天：先调蛋白主菜到目标蛋白，再调主食到目标热量，不够再加一份加餐 */
function scaleDay(meals,T){
 const calc=(meals,pf,cf)=>meals.map(m=>Object.assign({},m,{items:m.items.map(it=>{const r=roleOf(it);if(r==="p")return [it[0],it[1]*pf];if(r==="c")return [it[0],it[1]*cf];return it})}));
 function solve(meals){
  let K={f:0,c:0,p:0},P={f:0,c:0,p:0};
  meals.forEach(m=>m.items.forEach(it=>{const n=itemNut(it);const r=roleOf(it)||"f";K[r]+=n[0];P[r]+=n[1]}));
  let pf=1,cf=1;
  for(let k=0;k<3;k++){
   pf=P.p>0?clamp((T.p-P.f-P.c*cf)/P.p,1.0,2.0):1;
   cf=K.c>0?clamp((T.kcal-K.f-K.p*pf)/K.c,0.6,1.6):1;
  }
  const short=T.kcal-(K.f+K.p*pf+K.c*cf);
  return {pf,cf,need:(K.c>0?(T.kcal-K.f-K.p*pf)/K.c:1),short};
 }
 // 目标比底板高很多时，奶、酸奶、水果这类也一起放大一点（不动按个数算的食物和你自己加的）
 const base=sumItems(meals.flatMap(m=>m.items))[0];
 const gf=clamp(1+(T.kcal/Math.max(base,1)-1)*0.6,0.8,1.35);
 if(Math.abs(gf-1)>0.04)meals=meals.map(m=>Object.assign({},m,{items:m.items.map(it=>{if(!Array.isArray(it)||it[2]||roleOf(it))return it;const f=F[it[0]];if(!f||(f[9]&&!["milk","soymilk","milk_low"].includes(it[0]))||!["乳蛋","水果","蔬菜"].includes(f[2]))return it;return [it[0],it[1]*gf]})}));
 let r=solve(meals);
 // 主食要放大太多时，加一份加餐（最多两份），避免一顿饭吃太多
 if(r.need>1.4){meals=meals.concat([{id:"boost",idx:20,time:"20:30",t:1230,sl:{slot:"加",loc:"home"},items:M.boost.i}]);r=solve(meals)}
 if(r.need>1.55){meals=meals.concat([{id:"boost2",idx:21,time:"睡前",t:1290,sl:{slot:"加",loc:"home"},items:M.boost2.i}]);r=solve(meals)}
 const out=calc(meals,r.pf,r.cf);
 out.forEach(m=>{m.items=m.items.map(it=>Array.isArray(it)?(it[2]?it:[it[0],roundG(it[0],it[1])]):it)});
 return {meals:out,pf:r.pf,cf:r.cf};
}

function toMin(x){const m=String(x||"").match(/(\d{1,2})[:：](\d{2})/);return m?(+m[1])*60+(+m[2]):null}
function hm(x){x=Math.round(x);return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
function daySchedule(p,wd){
 const cls=((p.classes||{})[wd]||[]).map(c=>({s:toMin(c[0]),e:toMin(c[1]),n:c[2]||""})).filter(c=>c.s!=null&&c.e!=null&&c.e>c.s).sort((a,b)=>a.s-b.s);
 const wake=toMin(p._wakeToday||p.wake[wd])??510, ready=wake+(+p.routine||0), cm=+p.commute||0;
 const busy=(t,d)=>cls.some(c=>t<c.e&&t+d>c.s);
 const nextFree=(t,d)=>{let x=t;for(let k=0;k<30&&busy(x,d);k++){const c=cls.find(c=>x<c.e&&x+d>c.s);x=c.e}return x};
 const best=(from,to,d,goal,step)=>{let b=null;for(let t=from;t<=to;t+=step){if(!busy(t,d)&&(b==null||Math.abs(t-goal)<Math.abs(b-goal)))b=t}return b};
 const first=cls[0], last=cls[cls.length-1];
 const pres=cls.length?[first.s-cm,last.e+cm]:null;
 const loc=t=>pres&&t>=pres[0]&&t<pres[1]?"school":"home";
 const notes=[];
 // 早餐
 let b;
 const leave=first?first.s-cm:1e9;
 if(ready+15<=leave||(first&&first.s>=ready+240)){b={t:ready,loc:"home"}}
 else{const t=nextFree(first.s,10);b={t,loc:"school",grab:true};
  notes.push(`${hm(wake)} 起床、${hm(first.s)} 有课，来不及在家吃早餐 → 带一份不用加热的，${hm(t)} 下课吃`)}
 // 午餐
 const up15=x=>Math.ceil(x/15)*15;
 let l=best(up15(Math.max(b.t+150,660)),840,30,750,15);
 if(l==null)l=best(Math.max(b.t+60,630),900,20,750,5);
 if(l==null)l=nextFree(Math.max(b.t+90,660),15);
 // 晚餐
 let d=Math.max(toMin(p.dinner)??1110,(pres?pres[1]:0)+20);d=nextFree(d,30);
 // 加餐
 let sn=best(up15(Math.max(l+150,870)),Math.min(1020,d-90),10,930,5);
 if(sn==null)sn=nextFree(Math.max(l+150,870),10);
 if(sn>d-60)sn=Math.max(l+120,d-120);
 const slots=[];
 slots.push({idx:0,slot:"早",t:b.t,loc:b.loc,grab:!!b.grab});
 slots.push({idx:1,slot:"午",t:l,loc:loc(l)});
 slots.push({idx:2,slot:"加",t:sn,loc:loc(sn)});
 slots.push({idx:3,slot:"晚",t:d,loc:loc(d)});
 slots.forEach(x=>{if(x.loc==="school"&&!x.grab&&!notes.some(n=>n.includes(hm(x.t))))notes.push(`${hm(x.t)} ${x.brunch?"早午餐":x.slot==="加"?"加餐":x.slot+"餐"}在学校吃 → ${p.mw?"可以用便利店微波炉":"只排能带走、冷着吃的"}`)});
 const nonSchool=cls.length&&cls.every(c=>/打工|兼职|알바|아르바이트|社团|동아리|实习|인턴/.test(c.n));
 const away=nonSchool?"在外面":"在学校";
 if(nonSchool)notes.forEach((n,i)=>notes[i]=n.replace("在学校吃","在外面吃"));
 return {cls,slots,notes,wake,pres,away};
}
function mealOk(meal,sl,mode,p){
 if(!meal)return false;
 const t=meal.t||[];
 if(meal.custom)return true;
 if(sl.grab&&!(t.includes("p")&&t.includes("cold")))return false;
 if(sl.loc==="school"&&!t.includes("p"))return false;
 if(sl.loc==="school"&&!p.mw&&!t.includes("cold"))return false;
 if(mode.busy&&!(t.includes("q")||t.includes("pre")||t.includes("cold")))return false;
 return true;
}
function whyNot(meal,sl,p){
 const t=meal.t||[];
 if(sl.loc==="school"&&!t.includes("p"))return "在学校没法做";
 if((sl.grab||sl.loc==="school"&&!p.mw)&&!t.includes("cold"))return "要加热";
 return "";
}
/* 把一个食物换成另一个：蛋白类按蛋白等量，其余按热量等量 */
function convertItem(it,nk){
 const a=F[it[0]],b=F[nk];if(!a||!b)return it;
 let g;
 if((a[11]==="p"||b[11]==="p")&&a[4]>5&&b[4]>5)g=it[1]*a[4]/b[4];
 else if(b[3]>0)g=it[1]*a[3]/b[3]; else g=it[1];
 g=clamp(g,it[1]*0.3,it[1]*3);
 if(b[9])g=Math.max(b[9]/2,Math.round(g/(b[9]/2))*(b[9]/2));
 return it[2]?[nk,Math.round(g),1]:[nk,g];
}
function applyEdits(items,p,dateStr,idx,slot,opt){
 const pr=(S.prefs[p.id]||{}), ed=opt.base?{}:(((S.edits[p.id]||{})[dateStr]||{})[idx]||{});
 let out=items.map(it=>Array.isArray(it)?it.slice():it);
 const grep=pr.rep||{};
 out=out.map(it=>Array.isArray(it)&&grep[it[0]]&&F[grep[it[0]]]?convertItem(it,grep[it[0]]):it);
 const drep=ed.rep||{};
 out=out.map(it=>Array.isArray(it)&&drep[it[0]]&&F[drep[it[0]]]?convertItem(it,drep[it[0]]):it);
 const rm=ed.rm||[];
 out=out.map((it,i)=>Array.isArray(it)?it:Object.assign({},it,{_k:"c"+i}));
 out=out.filter(it=>!(Array.isArray(it)?rm.includes(it[0]):rm.includes(it._k)));
 ((pr.add||{})[slot]||[]).filter(([k])=>!(ed.rmAdd||[]).includes(k)).concat(ed.add||[]).forEach(([k,g])=>{if(F[k])out.push([k,g,1])});
 const eg=ed.g||{};
 out=out.map(it=>{
  if(Array.isArray(it)){return eg[it[0]]!=null?[it[0],+eg[it[0]],1]:it}
  if(eg[it._k]!=null&&it.g>0){const r=eg[it._k]/it.g;return Object.assign({},it,{g:+eg[it._k],kcal:it.kcal*r,p:it.p*r,c:it.c*r,f:it.f*r,fi:it.fi*r,_set:1})}
  return it;
 });
 return out;
}
/* 某个人某天的完整计划 */
function dayPlan(p,dateStr,opt){
 opt=opt||{}; ensureProfile(p);
 const T0=targets(p); const wd=parseD(dateStr).getDay();
 const AM=allMeals();
 const mode=opt.base?{}:((S.modes[p.id]||{})[dateStr]||{});
 const swaps=opt.base?{}:((S.swaps[p.id]||{})[dateStr]||{});
 const train=mode.train!=null?mode.train:(p.train||[]).includes(wd);
 p._wakeToday=mode.wake||null; const sch=daySchedule(p,wd); p._wakeToday=null;
 let meals=sch.slots.map(sl=>{
  const base=WEEK[wd][sl.idx][0];
  let mid=swaps[sl.idx]||base, auto=false;
  if(!swaps[sl.idx]&&!mealOk(AM[mid],sl,mode,p)){
   const pool=Object.keys(AM).filter(k=>AM[k].s===sl.slot&&k!=="post"&&k!=="boost"&&k!=="boost2"&&mealOk(AM[k],sl,mode,p));
   if(pool.length){mid=pickFrom(pool,dateStr+sl.idx);auto=true}
  }
  const meal=AM[mid]||AM[base];
  return {id:AM[mid]?mid:base,idx:sl.idx,time:hm(sl.t),t:sl.t,sl,auto,items:applyEdits(meal.i,p,dateStr,sl.idx,sl.slot,opt),out:(mode.out||[]).includes(sl.idx)};
 });
 if(train) meals.push({id:"post",idx:9,time:"训练后",t:1260,sl:{slot:"练",loc:"home"},items:applyEdits(M.post.i,p,dateStr,9,"练",opt)});
 const T=Object.assign({},T0,{kcal:T0.kcal+(train?150:0),c:T0.c+(train?38:0)});
 const sc=scaleDay(meals,T);
 const tot=sumItems(sc.meals.flatMap(m=>m.items));
 AWAY=sch.away; return {T,train,mode,meals:sc.meals,tot,wd,sch};
}

function icsEsc(t){return String(t).replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\n/g,"\\n")}
function icsTime(d,min){return d.replace(/-/g,"")+"T"+String(Math.floor(min/60)).padStart(2,"0")+String(min%60).padStart(2,"0")+"00"}
function buildICS(p,days){
 const AM=allMeals(); const ev=[]; const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
 const add=(d,min,dur,title,desc,uid)=>ev.push(["BEGIN:VEVENT","UID:"+uid+"@diet-helper","DTSTAMP:"+stamp,"DTSTART:"+icsTime(d,min),"DTEND:"+icsTime(d,Math.min(min+dur,1439)),"SUMMARY:"+icsEsc(title),"DESCRIPTION:"+icsEsc(desc),"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(title),"TRIGGER:-PT0M","END:VALARM","END:VEVENT"].join("\r\n"));
 for(let i=0;i<days;i++){
  const d=addDays(todayStr(),i); const pl=dayPlan(p,d);
  pl.meals.forEach(m=>{if(m.out||typeof m.t!=="number")return;const meal=AM[m.id]||M[m.id];if(!meal)return;
   const n=sumItems(m.items);
   add(d,m.t,20,`🍽 ${mealLabel(m)}：${meal.n}`,`${itemsText(m.items)}\n${Math.round(n[0])} kcal · 蛋白 ${Math.round(n[1])}g\n${meal.how||""}`,d+"-"+m.idx)});
  if(pl.sch.pres){const sm=pl.meals.filter(m=>m.sl&&m.sl.loc==="school"&&!m.out);if(sm.length)add(d,Math.max(0,pl.sch.pres[0]-10),10,"🎒 出门带上",sm.map(m=>`${m.time} ${(AM[m.id]||{}).n||""}`).join("\n"),d+"-bring")}
  const tm=dayPlan(p,addDays(d,1)); const thaw={};
  tm.meals.forEach(m=>{const meal=AM[m.id];if(m.out||(meal&&meal.t.includes("pre")))return;m.items.forEach(it=>{if(Array.isArray(it)&&THAW.has(it[0]))thaw[it[0]]=(thaw[it[0]]||0)+it[1]})});
  const tk=Object.keys(thaw); if(tk.length)add(d,21*60+30,10,"🧊 解冻明天的食材",tk.map(k=>`${F[k][0]} ${Math.round(thaw[k])}g`).join("、"),d+"-thaw");
  if(PREP_DAYS[pl.wd]!=null)add(d,16*60,60,"🥘 今天备餐","打开饮食助手看备餐清单",d+"-prep");
 }
 const fold=line=>{const enc=new TextEncoder();let out="",cur="",n=0;for(const ch of line){const b=enc.encode(ch).length;if(n+b>73){out+=cur+"\r\n ";cur="";n=1}cur+=ch;n+=b}return out+cur};
 return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//diet-helper//CN","CALSCALE:GREGORIAN","X-WR-CALNAME:饮食助手"].concat(ev,["END:VCALENDAR"]).join("\r\n").split("\r\n").map(fold).join("\r\n");
}

document.addEventListener("click",e=>{

 else if(a==="eat"||a==="skip"||a==="uneat"){closeModal();const i=+el.dataset.i;setLog(p,d,L=>{if(a==="uneat")delete L.e[i];else L.e[i]=a==="eat"?1:0});

 else if(a==="reset"){closeModal();const i=+el.dataset.i;const ed=((S.edits[p.id]||{})[d]||{});delete ed[i];setSwap(i,null)}
 else if(a==="pick"){view.pk=null;openPick(+el.dataset.i)}
 else if(a==="pkf"){view.pk.f=el.dataset.f;openPick(view.pk.idx)}

 else if(a==="mclose"){closeModal();view.fp=null;if(view.imp&&!view.imp.busy)view.imp=null}
 else if(a==="iact"){const k=el.dataset.k,i=+el.dataset.i;const it=curItem(p,d,i,k);const nm=it?(Array.isArray(it)?F[k][0]:it.n):k;const g=it?Math.round(Array.isArray(it)?it[1]:it.g):0;
   const acts=[{label:"改克数（吃了多少填多少）",act:"igram",data:{i,k}}];if(F[k])acts.push({label:"换成别的食物",act:"irep",data:{i,k,s:el.dataset.s}});acts.push({label:"删掉",act:"irm",red:1,data:{i,k,f:el.dataset.f}});
   sheet(`${esc(nm)} · ${g}g`,acts)}
 else if(a==="igram"){openGram(+el.dataset.i,el.dataset.k)}
 else if(a==="gstep"){const inp=document.getElementById("gIn");inp.value=Math.max(0,(+inp.value||0)+(+el.dataset.d))}
 else if(a==="gsave"){const v=parseFloat((document.getElementById("gIn")||{}).value);if(!(v>=0)){toast("填一个克数");return}const ed=edOf(p,d,+el.dataset.i);ed.g=Object.assign({},ed.g,{[el.dataset.k]:Math.round(v)});closeModal();save();render();toast(v===0?"记为 0g":"已改成 "+Math.round(v)+"g")}
 else if(a==="gauto"){const ed=edOf(p,d,+el.dataset.i);if(ed.g)delete ed.g[el.dataset.k];closeModal();save();render();toast("改回自动分量")}
 else if(a==="mmore"){const i=+el.dataset.i;const pl=dayPlan(p,d);const m=pl.meals.find(x=>x.idx===i);const ed=((S.edits[p.id]||{})[d]||{})[i];const sw=((S.swaps[p.id]||{})[d]||{})[i];
   const stt=(getLog(p,d).e||{})[i];
   const acts=[{label:"换一整顿",act:"pick",data:{i}},{label:"＋ 加食物",act:"iadd",data:{i,s:m?m.sl.slot:""}},{label:stt===0?"取消“没吃”":"这顿没吃",act:stt===0?"uneat":"skip",data:{i}},{label:m&&m.out?"改回在家吃":"这顿在外面吃",act:"out",data:{i}}];
   if(sw||(ed&&Object.keys(ed).length))acts.push({label:"恢复原样",act:"reset",red:1,data:{i}});
   sheet(m?`${mealLabel(m)} · ${m.time}`:"",acts)}
 else if(a==="irep"){view.fp=null;openFood({mode:"rep",idx:+el.dataset.i,key:el.dataset.k,slot:el.dataset.s})}
 else if(a==="iadd"){view.fp=null;openFood({mode:"add",idx:+el.dataset.i,key:null,slot:el.dataset.s})}
 else if(a==="irm"){closeModal();const i=+el.dataset.i,k=el.dataset.k;const ed=edOf(p,d,i);
   if(el.dataset.f==="1"){const before=(ed.add||[]).length;ed.add=(ed.add||[]).filter(x=>x[0]!==k);if(ed.add.length===before)ed.rmAdd=(ed.rmAdd||[]).concat([k])}
   else ed.rm=(ed.rm||[]).concat([k]);
   save();render();toast("已删掉，分量会自动补到别的食物上")}
 else if(a==="fcat"){view.fp.cat=el.dataset.c;paintFood()}
 else if(a==="fsel"){const k=el.dataset.k;view.fp.sel=k;view.fp.g=F[k][9]?(k==="egg"?100:F[k][9]):100;paintFood()}
 else if(a==="fback"){view.fp.sel=null;paintFood()}
 else if(a==="fqty"){const f=F[view.fp.sel];view.fp.g=Math.max(f[9],view.fp.g+(+el.dataset.d)*f[9]);view.fp.always=(document.getElementById("falways")||{}).checked;paintFood()}
 else if(a==="fok"){
  const fp=view.fp; const always=(document.getElementById("falways")||{}).checked;
  if(fp.mode==="rep"){
   if(always){S.prefs[p.id]=S.prefs[p.id]||{};S.prefs[p.id].rep=Object.assign({},S.prefs[p.id].rep,{[fp.key]:fp.sel})}
   else{const ed=edOf(p,d,fp.idx);ed.rep=Object.assign({},ed.rep,{[fp.key]:fp.sel})}
   S.learn[p.id]=S.learn[p.id]||{};const lk=fp.key+">"+fp.sel;S.learn[p.id][lk]=(S.learn[p.id][lk]||0)+1;

 }
 else if(a==="learnyes"){const [x,y]=el.dataset.k.split(">");S.prefs[p.id]=S.prefs[p.id]||{};S.prefs[p.id].rep=Object.assign({},S.prefs[p.id].rep,{[x]:y});save();render();toast("记住了")}

 else if(a==="delpref"){const pr=S.prefs[p.id]||{};if(el.dataset.t==="rep")delete (pr.rep||{})[el.dataset.k];else pr.add[el.dataset.s]=(pr.add[el.dataset.s]||[]).filter(x=>x[0]!==el.dataset.k);save();render()}
 else if(a==="wsave"){const v=parseFloat((document.getElementById("wIn")||{}).value);if(!(v>25&&v<300)){toast("填一下体重");return}
   S.weights[p.id]=(S.weights[p.id]||[]).filter(x=>x.d!==todayStr()).concat([{d:todayStr(),w:v}]);const old=p.w;p.w=v;save();render();
   toast(`已记录 ${v}kg${Math.abs(v-old)>=0.1?`（${v>old?"+":""}${(v-old).toFixed(1)}），分量已按新体重重算`:""}`)}
 else if(a==="goto"){view.date=el.dataset.d;location.hash="today";render()}
 else if(a==="chkb"){const key=todayStr().slice(0,7);S.checks[key]=S.checks[key]||{};S.checks[key][el.dataset.k]=!S.checks[key][el.dataset.k];save();render()}
 else if(a==="imp")openImport();
 else if(a==="cpA"){copyText(analyzePrompt()).then(ok=>toast(ok?"已复制，去 Claude 粘贴并附上截图":"复制失败，请长按选择复制"))}
 else if(a==="cpS"){copyText(schedulePrompt()).then(ok=>toast(ok?"已复制，去 Claude 粘贴并附上课表":"复制失败，请长按选择复制"))}
 else if(a==="aread")readAnalysis();

function parseClasses(txt){
 return String(txt||"").split(/\n+/).map(l=>{const m=l.match(/(\d{1,2}[:：]\d{2})\s*[-–~～到]\s*(\d{1,2}[:：]\d{2})\s*(.*)/);if(!m)return null;const f=x=>{const [h,mm]=x.replace("：",":").split(":");return h.padStart(2,"0")+":"+mm};return [f(m[1]),f(m[2]),m[3].trim()]}).filter(Boolean);
}
